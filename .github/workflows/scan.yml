name: NSE Swing Scan

# Scheduling reality (read before changing the crons)
# ---------------------------------------------------
# GitHub's `schedule` is best-effort and, on this repo's free-tier runners, it
# fires HOURS late: measured over 45 scheduled runs the median delay was 5.4 h
# and 37/45 started more than 4 h after their window (a cron cannot fire
# *early*, so a 11:16 UTC run is the 03:30 cron arriving 7.8 h late). The
# documented "09:00 IST scan" therefore completes around 16:46 IST — after the
# 15:30 close — and the "16:00 IST" scan around 23:40 IST.
#
# Consequences that are handled deliberately here:
#   * both daily runs land AFTER the close, so they describe the same session.
#     `performance.py` keeps one cohort per trading date (dedupe_snapshots_by_date)
#     instead of double-counting N.
#   * `scan_status.json` must attribute the run to the cron that *fired* it,
#     not the nearest wall clock. GitHub exposes `github.event.schedule`, so we
#     pass it through and stop guessing (see backend/scan_schedule.py).
#   * an external scheduler can drive this workflow punctually through
#     `repository_dispatch` (PUNCTUAL_SCHEDULER not required — any cron service
#     with a GitHub token works). See README "Scheduling".
on:
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}
  repository_dispatch:
    types: [scheduled-scan]

permissions:
  contents: write   # needed to commit the scan output back to the repo

concurrency:
  group: nse-swing-scan
  cancel-in-progress: false   # queue duplicate triggers; do NOT cancel a running scan

jobs:
  scan:
    runs-on: ubuntu-latest
    # Recovery pass for rate-limited symbols can add 10–20 min on cold/partial
    # cache; 60 min leaves headroom without burning free-tier budget on hangs.
    timeout-minutes: 60
    outputs:
      # Surfaced so a failed run is legible in the UI without reading logs.
      outcome: ${{ steps.scan.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore backend cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: backend/cache
          # GitHub caches are IMMUTABLE: a fixed key can be written once and
          # never updated, so the cache would freeze at whatever the first run
          # after eviction produced. A versioned, per-run key + a prefix
          # restore-keys always restores the newest entry and always writes a
          # fresh one; GitHub evicts untouched entries after 7 days, which
          # bounds the growth.
          key: nse-swing-cache-v1-${{ github.run_id }}
          restore-keys: |
            nse-swing-cache-v1-
            nse-swing-cache-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Resolve schedule context
        id: ctx
        # One place that maps "which trigger fired this run" to (window label,
        # healthcheck URL, snapshot slot, skip decision). Three triggers
        # converge here: `schedule` (GitHub cron, hours late), `repository_dispatch`
        # (the punctual Netlify scheduler, which names the window in
        # client_payload) and `workflow_dispatch` (a human; no window, no pings).
        #
        # The `skip` output suppresses a late duplicate: if the punctual
        # scheduler already covered this window, GitHub's own cron — which can
        # fire 7-8 h later for the same window — must not scan and commit again.
        # Logic lives in scripts/resolve_schedule_context.py (unit-tested, and
        # covered by check_workflow_scripts.py).
        working-directory: backend
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_PAYLOAD_WINDOW: ${{ github.event.client_payload.window }}
          MORNING_URL: ${{ secrets.HEALTHCHECK_PING_URL_MORNING }}
          EVENING_URL: ${{ secrets.HEALTHCHECK_PING_URL_EVENING }}
        run: python scripts/resolve_schedule_context.py

      - name: Ping healthchecks.io (scan started)
        if: steps.ctx.outputs.scheduled == 'true' && steps.ctx.outputs.skip != 'true'
        env:
          URL: ${{ steps.ctx.outputs.healthcheck_url }}
        continue-on-error: true
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::healthchecks.io URL for this window is not configured; skipping start ping."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "${URL}/start" \
            || echo "::warning::healthchecks.io start ping failed"

      - name: Run full scan
        id: scan
        # Skipped when an earlier trigger already covered this window.
        if: steps.ctx.outputs.skip != 'true'
        working-directory: backend
        # Exit codes are meaningful and handled below:
        #   0 = good scan (file written)
        #   2 = coverage below the 85% floor (file NOT written, last-good kept)
        #   3 = a fail-closed gate could not verify for the whole universe
        #       (file written, but gate_pass_count reflects the outage)
        run: |
          set +e
          python scanner.py --top-n 500 --workers 4 --sleep 0.5 \
            --lenient-external-gates \
            --output ../frontend/public/data/latest_scan.json
          code=$?
          echo "scanner_exit=$code" >> "$GITHUB_OUTPUT"
          # 0 = good scan; 3 = published with a degraded-gate warning (the
          # payload already carries source_health, and the contract step
          # surfaces it). Anything else (2 = coverage floor, 1 = crash) fails
          # the job so the failure ping fires.
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            exit 0
          fi
          echo "::error::scanner exited $code"
          exit "$code"

      - name: Ping healthchecks.io (scan failed)
        # Runs for ANY earlier failure, including the scan itself. The success
        # ping is deliberately the LAST step, not this one.
        if: failure() && steps.ctx.outputs.scheduled == 'true'
        env:
          URL: ${{ steps.ctx.outputs.healthcheck_url }}
        continue-on-error: true
        run: |
          if [ -n "$URL" ]; then
            curl -fsS -m 10 --retry 3 "${URL}/fail" \
              || echo "::warning::healthchecks.io fail ping failed"
          fi

      - name: Ping healthchecks.io (scan cancelled)
        # NOTE: a scheduled run cancelled while still queued never starts a job,
        # so no step (including this one) can execute. That case is caught by
        # healthchecks.io's own Period+Grace alert, which is the only mechanism
        # that can observe a run that never began. This step covers the case
        # where a run was started and then cancelled.
        if: cancelled() && steps.ctx.outputs.scheduled == 'true'
        env:
          URL: ${{ secrets.HEALTHCHECK_PING_URL_CANCELLED }}
        continue-on-error: true
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::HEALTHCHECK_PING_URL_CANCELLED not set; skipping cancellation ping."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "${URL}/fail" \
            || echo "::warning::healthchecks.io cancelled ping failed"

      - name: Validate JSON contract
        if: steps.ctx.outputs.skip != 'true'
        working-directory: backend
        run: |
          python - <<'PY'
          import json, sys

          path = "../frontend/public/data/latest_scan.json"
          with open(path) as fh:
              payload = json.load(fh)

          errors = []
          if not payload.get("generated_at"):
              errors.append("missing generated_at")
          stocks = payload.get("stocks")
          if not stocks:
              errors.append("stocks is empty")
          cov = payload.get("coverage") or {}
          if "priced" not in cov or "pct" not in cov:
              errors.append("missing coverage block")
          elif cov.get("pct", 0) < 0.85:
              errors.append(f"coverage {cov.get('pct')} < 0.85")

          health = payload.get("source_health") or {}
          if health.get("critical_source_failed"):
              # Not a hard failure: a degraded scan is published with its flag
              # so the dashboard can say "source outage" instead of "no picks".
              print(
                  f"::warning::degraded source gate(s): {health.get('degraded_gates')} "
                  f"— gate_pass_count={payload.get('gate_pass_count')} reflects the "
                  f"outage, not the market."
              )

          if errors:
              for e in errors:
                  print(f"::error::contract: {e}", file=sys.stderr)
              sys.exit(1)

          print(
              f"contract ok: {len(stocks)} stocks; "
              f"gate_pass_count={payload.get('gate_pass_count')}; coverage={cov}"
          )
          PY

      - name: Write dated snapshot + history index (B1)
        # Persists the current run as YYYY-MM-DD-{am|pm}.json (minified) and
        # updates frontend/public/data/snapshots/history_index.json. Rolling
        # 90-day prune runs in the same step. Cheap (~1-2 s), no network.
        # Scheduled runs pass their cron-derived slot explicitly so a delayed
        # morning run cannot be mislabeled as an evening snapshot.
        if: success() && steps.ctx.outputs.skip != 'true'
        working-directory: backend
        env:
          SLOT: ${{ steps.ctx.outputs.slot }}
        run: |
          slot_arg=""
          if [ -n "$SLOT" ]; then slot_arg="--slot $SLOT"; fi
          python scripts/snapshot_writer.py \
            --latest ../frontend/public/data/latest_scan.json \
            --snapshots ../frontend/public/data/snapshots \
            --retention-days 90 \
            $slot_arg

      - name: Write scan_status.json
        # Always run after a successful scan (skip on scan failure). Internal
        # errors are caught and surfaced as warnings — the file is best-effort
        # metadata and the frontend gracefully degrades if it's missing.
        if: success() && steps.ctx.outputs.skip != 'true'
        working-directory: backend
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ steps.ctx.outputs.window_utc }}
          GH_SCHEDULE_SOURCE: ${{ steps.ctx.outputs.source }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: python scripts/write_scan_status.py

      - name: Commit and push updated scan
        if: success() && steps.ctx.outputs.skip != 'true'   # require scan step to succeed; Write scan_status.json is best-effort and won't block this
        run: |
          git config user.name "nse-swing-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          # Separate `git add` calls: `git add A B C` validates every pathspec
          # before staging anything, so one missing path would silently stage
          # nothing and the commit step would exit 0 having done nothing.
          git add frontend/public/data/latest_scan.json
          git add frontend/public/data/scan_status.json || true
          git add frontend/public/data/snapshots/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Rebase+retry: outcome-tracker (or another scan) may land on main
          # between checkout and push. All reconciled paths are generated data
          # artifacts; a concurrent commit's edits to them are never more
          # authoritative than this run's fresh output. So resolve any rebase
          # content conflicts in favour of our new commit (-X theirs, where
          # "theirs" is the commit being replayed = this scan). Also abort+clean
          # any stale rebase BEFORE each retry (a previous run of this loop never
          # sees a fresh checkout) so a failed rebase can never leave the working
          # tree in an unmergeable state that blocks the next attempt.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed; retrying…"
            sleep $((i * 3))
          done
          echo "::error::failed to push scan commit after retries"
          exit 1

      - name: Save backend cache
        # Save only after a successful scan, and only the key this run restored
        # into — a failed scan can leave partial entries (rate-limit payloads
        # are already excluded by should_cache_yf_payload).
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: backend/cache
          key: nse-swing-cache-v1-${{ github.run_id }}

      - name: Send Telegram digest (C3)
        if: success() && steps.ctx.outputs.skip != 'true'
        # Soft-fails: the script exits 0 even on Telegram error. The scan
        # itself is the load-bearing artifact; a missing alert must never
        # roll back a successful deploy.
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_digest.py \
            --latest ../frontend/public/data/latest_scan.json \
            --history ../frontend/public/data/snapshots/history_index.json

      - name: Build frontend (for Netlify deploy)
        # dist/ is gitignored and nothing above builds it. Run AFTER the scan
        # wrote frontend/public/data/latest_scan.json so the fresh data is
        # copied into dist by Vite.
        if: success() && steps.ctx.outputs.skip != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Netlify
        id: deploy
        if: success() && steps.ctx.outputs.skip != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            # Not an error: Netlify's GitHub integration auto-deploys on push.
            # But this step must NOT report a deploy when it did not deploy —
            # the old code exited 0 with a warning, so a broken integration
            # would freeze the site while every run stayed green.
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Netlify CLI secrets are not set; relying on the Netlify GitHub integration (auto-deploy on push)."
            exit 0
          fi
          npm install --no-save netlify-cli@27
          # Absolute paths on purpose: netlify.toml sets `base = "frontend"`,
          # and the CLI resolves relative --dir/--functions paths against that
          # base, so `--dir=frontend/dist` would look for
          # `frontend/frontend/dist`. Absolute paths sidestep the ambiguity.
          # --no-build: the frontend was already built above; letting the CLI
          # re-run `npm run build` would rebuild in a possibly different cwd.
          # --functions must be the PARENT of the function files
          # (netlify/functions), and the shared helper lives in netlify/lib —
          # Netlify bundles relative imports, but only files inside the
          # functions directory are deployed as functions.
          npx netlify deploy --prod --no-build \
            --dir="$PWD/frontend/dist" \
            --functions="$PWD/frontend/netlify/functions" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$NETLIFY_SITE_ID" \
            --message="scan-$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the deployed site serves this scan
        # The only check that proves the product actually updated. Closes the
        # class of failure that let a scanner build ship to klinote.one for
        # nine days: a deploy step can "succeed" while the wrong site (or no
        # site) is serving users.
        if: success() && steps.ctx.outputs.skip != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          url="${SITE_URL:-https://nse-swing-scanner.netlify.app}"
          echo "Verifying $url …"

          title=$(curl -fsS -m 20 --retry 3 "$url/" | grep -o '<title>[^<]*</title>' | head -1 || true)
          if [ "$title" != "<title>NSE Swing Scanner</title>" ]; then
            echo "::error::deployed site title is '$title', expected '<title>NSE Swing Scanner</title>' — wrong site or broken deploy"
            exit 1
          fi

          python - <<'PY'
          import datetime, json, os, subprocess, sys, urllib.request

          url = os.environ.get("SITE_URL") or "https://nse-swing-scanner.netlify.app"
          local = "frontend/public/data/latest_scan.json"
          with open(local) as fh:
              expected = json.load(fh)["generated_at"]

          with urllib.request.urlopen(f"{url}/data/latest_scan.json?t={datetime.datetime.now().timestamp()}", timeout=30) as r:
              served = json.load(r)["generated_at"]

          if served != expected:
              print(
                  f"::error::served generated_at {served} != committed {expected}. "
                  f"The CDN is serving a stale build (cache TTL on /data/* is 60 s; "
                  f"retry once before assuming the deploy failed).",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"deploy verified: served generated_at {served}")
          PY

      - name: Ping healthchecks.io (scan succeeded)
        # LAST step, deliberately: it used to fire right after the scanner, so a
        # failure in validation / snapshot / commit / deploy still reported
        # green and no alert was ever raised.
        # Not sent when the run was skipped: the trigger that did the work
        # already reset this window's timer.
        if: success() && steps.ctx.outputs.scheduled == 'true' && steps.ctx.outputs.skip != 'true'
        env:
          URL: ${{ steps.ctx.outputs.healthcheck_url }}
        continue-on-error: true
        run: |
          if [ -n "$URL" ]; then
            curl -fsS -m 10 --retry 3 "${URL}" \
              || echo "::warning::healthchecks.io success ping failed"
          fi
