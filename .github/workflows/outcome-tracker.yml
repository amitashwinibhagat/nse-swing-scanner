name: Outcome Tracker (forward-return attribution)

# Implements the C1 plan item. Runs weekly (Saturday morning IST) to:
#   1. Read all dated snapshots under frontend/public/data/snapshots/
#   2. Fetch T+5/T+10/T+20 forward returns (per-name vs ^NSEI) for the
#      gate-passed cohort of each snapshot.
#   3. Write frontend/public/data/performance.json with per-window and
#      per-score-bucket cohort stats (median + IQR, N per cohort).
#   4. Commit + push.
#
# Schedule rationale: forward-return data is only meaningful after the
# trailing window completes. A Saturday morning run gives the previous
# week's snapshots T+20 coverage by Tuesday/Wednesday, and the week
# before that complete T+20 coverage; the trailing 90-day window always
# has at least some fully-closed cohorts.
#
# Statistical rules (per strategic review §6):
#   - per-scan-date cohorts (no pooling — overlapping T+20 windows are
#     autocorrelated)
#   - report N, median, IQR (not just mean)
#   - untrackable symbols (delisted / fetch failed) are a separate bucket
#     and never silently dropped

on:
  # Live schedule (the .circleci port was removed in 1.3.3 — its `triggers:`
  # are ignored on GitHub App projects). Do NOT also create CircleCI UI
  # schedule triggers while this cron is live (double-run).
  schedule:
    - cron: "0 4 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write   # commit performance.json back to main

concurrency:
  group: nse-swing-outcome
  cancel-in-progress: false

jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Compute performance
        working-directory: backend
        run: |
          python scripts/compute_performance.py \
            --snapshots ../frontend/public/data/snapshots \
            --output ../frontend/public/data/performance.json \
            --cache-dir cache

      - name: Evaluate feedback loop
        # 1.5.0: close the loop — sub-score ICs + shadow re-scoring evidence
        # from the labelled rows. Report-only; weight promotion stays a
        # human decision gated by the checklist in the report.
        working-directory: backend
        run: |
          python scripts/evaluate_feedback.py \
            --performance ../frontend/public/data/performance.json \
            --out ../docs/feedback/feedback-latest.json \
            --report ../docs/feedback/feedback-report.md

      - name: Generate weekly digest
        # Public accuracy digest (1.4.3): committed under frontend/public/
        # digests/ so Netlify serves it at /digests/YYYY-Www.md with no
        # extra routing. %G-W%V = ISO week-year + week (GNU date).
        working-directory: backend
        run: |
          python scripts/generate_digest.py \
            --performance ../frontend/public/data/performance.json \
            --out ../frontend/public/digests/$(date -u +'%G-W%V').md \
            --site-base https://nse-swing-scanner.netlify.app

      - name: Commit and push performance.json + feedback + digest
        run: |
          git config user.name "nse-swing-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/data/performance.json frontend/public/digests/ docs/feedback/ || true
          git diff --staged --quiet && echo "No changes to performance.json" && exit 0
          git commit -m "Performance update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          ## Resolve any rebase conflicts in favour of our new commit
          ## (-X theirs, where "theirs" is the commit being replayed = this
          ## attribution), and abort+clean stale rebase state before each retry
          ## so a failed rebase can't leave unmergeable files blocking the next
          ## attempt.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed; retrying…"
            sleep $((i * 3))
          done
          echo "::error::failed to push performance commit after retries"
          exit 1